<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Reverser & Vowel Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7eb6eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #7a5237;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #f1f1f1;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            font-weight: bold;
            color: #ebe8e8;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
        }
        .result-box {
            margin-top: 20px;
            background-color: #eef2f3;
            padding: 15px;
            border-radius: 5px;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 16px;
            color: #444;
        }
        .result-item span {
            font-weight: bold;
            color: #007BFF;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Text Analyzer</h1>
   
    <label for="textInput">Enter your string or sentence:</label>
    <textarea id="textInput" placeholder="Type something here..." oninput="analyzeText()"></textarea>
   
    <div class="result-box">
        <div class="result-item">Reversed Text: <span id="reversedOutput"></span></div>
        <div class="result-item">Vowel Count: <span id="vowelCountOutput">0</span></div>
    </div>
</div>

<script>
function analyzeText() {
    // Get the input value
    const input = document.getElementById('textInput').value;
   
    // 1. Reverse the string
    const reversed = input.split('').reverse().join('');
   
    // 2. Count vowels (a, e, i, o, u - case insensitive)
    const vowelMatch = input.match(/[aeiouy]/gi);
    const vowelCount = vowelMatch ? vowelMatch.length : 0;
   
    // Update the UI
    document.getElementById('reversedOutput').textContent = reversed;
    document.getElementById('vowelCountOutput').textContent = vowelCount;
}
</script>

</body>
</html>
