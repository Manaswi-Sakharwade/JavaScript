<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grading System - PRN 24070521169</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            color: #3b82f6;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #result {
            margin-top: 15px;
            font-size: 17px;
            color: #444;
        }

        .footer {
            margin-top: 20px;
            color: gray;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🎓 Student Grading System</h2>

    <input type="text" id="name" placeholder="Enter Student Name">

    <input type="number" id="marks" placeholder="Enter Marks (0-100)">

    <button onclick="calculateGrade()">Show Grade</button>

    <div id="result"></div>

    <div class="footer">
        PRN: 24070521169
    </div>
</div>

<script>

function calculateGrade() {

    let name = document.getElementById("name").value.trim();
    let marks = document.getElementById("marks").value;
    let result = document.getElementById("result");

    // Form Validation
    if (name === "") {
        alert("Please enter the student's name.");
        return;
    }

    if (marks === "") {
        alert("Please enter marks.");
        return;
    }

    marks = Number(marks);

    if (marks < 0 || marks > 100) {
        alert("Marks should be between 0 and 100.");
        return;
    }

    // Control Structures (if-else)
    let grade;

    if (marks >= 90) {
        grade = "A+";
    }
    else if (marks >= 80) {
        grade = "A";
    }
    else if (marks >= 70) {
        grade = "B";
    }
    else if (marks >= 60) {
        grade = "C";
    }
    else if (marks >= 40) {
        grade = "D";
    }
    else {
        grade = "F (Fail)";
    }

    result.innerHTML = `
        <h3>Result</h3>
        <p><b>Name:</b> ${name}</p>
        <p><b>Marks:</b> ${marks}</p>
        <p><b>Grade:</b> ${grade}</p>
    `;
}

</script>

</body>
</html>
