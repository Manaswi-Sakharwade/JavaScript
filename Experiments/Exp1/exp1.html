<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Demo - PRN 24070521169</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            width: 380px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #4b7bec;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        button {
            margin-top: 15px;
            padding: 10px 22px;
            border: none;
            border-radius: 25px;
            background: #4b7bec;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3867d6;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: gray;
        }
    </style>

    <!-- Internal JavaScript -->
    <script>
        console.log("Internal JavaScript Loaded");
        console.info("Welcome to the JavaScript Demo!");
    </script>
</head>

<body>

<div class="card">
    <h1>✨ Welcome ✨</h1>

    <p id="message"></p>

    <!-- Inline JavaScript -->
    <button onclick="alert('Hello! Welcome to JavaScript 😊')">
        Click Me
    </button>

    <div class="footer">
        PRN: 24070521169
    </div>
</div>

<script>
    // Simulated External JavaScript (all code kept in one file)
    console.log("External JavaScript Loaded Successfully!");

    function greet() {
        console.log("Hello from External JavaScript!");
    }

    greet();

    // Welcome Message
    document.getElementById("message").innerHTML =
        "This webpage demonstrates <b>Inline</b>, <b>Internal</b>, and <b>External</b> JavaScript using console methods.";

    console.warn("This is a warning message.");
    console.error("This is an error message.");
</script>

</body>
