<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Colorful To-Do List</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fefcfb;
    margin: 20px;
  }
  h1 {
    text-align: center;
    color: #6b5b95;
    margin-bottom: 10px;
  }
  .header-info {
    text-align: center;
    font-size: 1.2em;
    margin-bottom: 20px;
    color: #333;
  }
  #todo-form {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  #task-input {
    width: 60%;
    padding: 10px;
    border: 2px solid #c7d2cc;
    border-radius: 8px;
    font-size: 16px;
  }
  #add-btn {
    padding: 10px 20px;
    margin-left: 10px;
    background-color: #88b04b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  #add-btn:hover {
    background-color: #78a041;
  }
  #todo-list {
    list-style: none;
    padding: 0;
    max-width: 600px;
    margin: 0 auto;
  }
  .todo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    margin-bottom: 10px;
    background-color: #ffe0f0;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s;
  }
  .task-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .task-text {
    font-size: 18px;
    color: #444;
  }
  input[type="checkbox"] {
    transform: scale(1.2);
    cursor: pointer;
  }
  .buttons {
    display: flex;
    gap: 8px;
  }
  button {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.3s;
  }
  button:nth-child(1) {
    background-color: #ffd1dc;
  }
  button:nth-child(1):hover {
    background-color: #ffb3c6;
  }
  button:nth-child(2) {
    background-color: #ff6f61;
    color: white;
  }
  button:nth-child(2):hover {
    background-color: #e65c50;
  }
  /* Style for editing input */
  .edit-input {
    font-size: 18px;
    padding: 4px 8px;
    border: 2px solid #88b04b;
    border-radius: 6px;
  }
  /* Style for completed tasks */
  .completed {
    text-decoration: line-through;
    opacity: 0.6;
  }
  /* Style for task counts */
  #task-counts {
    text-align: center;
    margin-top: 20px;
    font-size: 1.2em;
    color: #333;
  }
</style>
</head>
<body>

<h1>To-Do List</h1>
<div class="header-info">
  <p>Name: Manaswi Sakharwade | PRN: 24070521169</p>
</div>

<form id="todo-form">
  <input type="text" id="task-input" placeholder="Enter new task" />
  <button type="submit" id="add-btn">Add</button>
</form>

<ul id="todo-list"></ul>

<div id="task-counts">
  Tasks Left: <span id="tasks-left">0</span> | Tasks Done: <span id="tasks-done">0</span>
</div>

<script>
  const form = document.getElementById('todo-form');
  const taskInput = document.getElementById('task-input');
  const todoList = document.getElementById('todo-list');
  const tasksLeftSpan = document.getElementById('tasks-left');
  const tasksDoneSpan = document.getElementById('tasks-done');

  let totalTasks = 0;
  let completedTasks = 0;

  // Function to update task counts
  function updateCounts() {
    const remaining = totalTasks - completedTasks;
    tasksLeftSpan.textContent = remaining;
    tasksDoneSpan.textContent = completedTasks;
  }

  // Function to create a task item
  function createTaskItem(taskText) {
    const li = document.createElement('li');
    li.className = 'todo-item';

    const taskInfoDiv = document.createElement('div');
    taskInfoDiv.className = 'task-info';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';

    const span = document.createElement('span');
    span.className = 'task-text';
    span.textContent = taskText;

    // Initialize counts
    totalTasks++;
    updateCounts();

    // Toggle completed state
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        span.classList.add('completed');
        completedTasks++;
      } else {
        span.classList.remove('completed');
        completedTasks--;
      }
      updateCounts();
    });

    taskInfoDiv.appendChild(checkbox);
    taskInfoDiv.appendChild(span);

    const buttonsDiv = document.createElement('div');
    buttonsDiv.className = 'buttons';

    const editBtn = document.createElement('button');
    editBtn.textContent = 'Edit';

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete';

    // Edit button event
    editBtn.addEventListener('click', () => {
      const currentText = span.textContent;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentText;
      input.className = 'edit-input';

      // Replace span with input
      li.replaceChild(input, span);
      input.focus();

      // Change button to save
      editBtn.textContent = 'Save';

      // Save event
      editBtn.onclick = () => {
        span.textContent = input.value;
        li.replaceChild(span, input);
        editBtn.textContent = 'Edit';
        // Rebind the click event for editing again
        editBtn.onclick = arguments.callee;
      };
    });

    // Delete button event
    deleteBtn.addEventListener('click', () => {
      if (checkbox.checked) {
        completedTasks--;
      }
      totalTasks--;
      updateCounts();
      todoList.removeChild(li);
    });

    buttonsDiv.appendChild(editBtn);
    buttonsDiv.appendChild(deleteBtn);

    li.appendChild(taskInfoDiv);
    li.appendChild(buttonsDiv);
    return li;
  }

  // Handle form submission
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const taskText = taskInput.value.trim();
    if (taskText !== '') {
      const taskItem = createTaskItem(taskText);
      todoList.appendChild(taskItem);
      taskInput.value = '';
    }
  });
</script>

</body>
</html>
